name: skyseabooking
description: SkySea Booking - a flight and sea boat booking app for the Philippines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  crypto: ^3.0.7
  web: ^1.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
